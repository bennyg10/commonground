<style>
:root{--black:#0B0B0E;--d1:#111015;--d2:#17161C;--d3:#1E1D24;--d4:#26252D;--white:#FDFFFE;--lime:#D5DC99;--sage:#737F73;
  --w08:rgba(253,255,254,.08);--w15:rgba(253,255,254,.15);--w30:rgba(253,255,254,.3);--w50:rgba(253,255,254,.55);--w70:rgba(253,255,254,.75);
  --l10:rgba(213,220,153,.1);--l20:rgba(213,220,153,.22);--ok:#4A9B6F;--del:#E07A5F;--amb:#C9A84C}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--d1);color:var(--white);font-family:"DM Sans",sans-serif;font-size:15px;line-height:1.55;overflow-x:hidden}
a{color:var(--lime)}
button,input,select,textarea{font-family:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(17,16,21,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--w08)}
.bar{max-width:1120px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:center;gap:8px;text-decoration:none;flex:none}
.mark b{width:28px;height:28px;border-radius:7px;background:var(--lime);color:var(--black);display:flex;align-items:center;justify-content:center;font-family:Syne,sans-serif;font-size:11px;font-weight:800}
.crumb{font-size:13px;color:var(--w50);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb a{color:var(--w70);text-decoration:none}
.right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.tabs{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:none;border-bottom:2px solid transparent;color:var(--w50);font-size:14px;font-weight:600;padding:10px 12px 12px;cursor:pointer}
.tab.on{color:var(--lime);border-bottom-color:var(--lime)}
.tab .ct{display:inline-block;min-width:18px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;background:var(--d4);color:var(--w70);margin-left:5px}
main{max-width:1120px;margin:0 auto;padding:34px 28px 90px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--sage);margin-bottom:8px}
h1{font-family:Syne,sans-serif;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
h2{font-family:Syne,sans-serif;font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin-bottom:12px}
.lede{color:var(--w70);margin-top:6px}
.muted{color:var(--w50)}.small{font-size:13px}
.card{background:var(--d2);border:1px solid var(--w08);border-radius:16px;padding:22px 24px;margin-bottom:18px}
.card.hi{border-color:var(--l20);background:linear-gradient(135deg,rgba(213,220,153,.08),var(--d2) 60%)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;border:1px solid var(--w15);background:var(--d3);color:var(--white);font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--black)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--del);border-color:rgba(224,122,95,.35)}
.btn:disabled{opacity:.5;cursor:default}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid var(--w15);color:var(--w70);white-space:nowrap}
.pill.lime{background:var(--l10);border-color:var(--l20);color:var(--lime)}
.pill.ok{background:rgba(74,155,111,.14);border-color:rgba(74,155,111,.4);color:#8fd6ab}
.pill.amb{background:rgba(201,168,76,.12);border-color:rgba(201,168,76,.38);color:#e0c67a}
.pill.del{background:rgba(224,122,95,.12);border-color:rgba(224,122,95,.35);color:#f0a996}
.pill.gray{background:var(--d3);color:var(--w50)}
.stages{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}
.stages span{font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;background:var(--d3);color:var(--w30);border:1px solid var(--w08)}
.stages span.done{color:var(--w70)}
.stages span.on{background:var(--l10);color:var(--lime);border-color:var(--l20)}
.track{height:8px;background:var(--d4);border-radius:8px;overflow:hidden;margin:10px 0 6px}
.fill{height:100%;background:var(--lime)}
.big{font-family:Syne,sans-serif;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
label{display:block;font-size:12px;color:var(--sage);margin:0 0 6px}
input,select,textarea{width:100%;background:var(--d3);border:1px solid var(--w08);border-radius:10px;padding:11px 12px;font-size:14.5px;color:var(--white);outline:none;margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:var(--l20)}
input[type=range]{accent-color:#D5DC99;padding:0;border:none;background:none}
input[type=file]{padding:10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.form3{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}
.form3 input{margin-bottom:0}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--w08)}
.item:first-child{border-top:none;padding-top:2px}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700}
.linkbox{display:flex;gap:8px;margin-top:6px}
.linkbox input{margin:0;color:var(--lime);font-size:13px}
.empty{color:var(--w50);font-size:14px;padding:6px 0}
.msg{display:none;font-size:13px;border-radius:9px;padding:10px 12px;margin:0 0 12px;background:rgba(224,122,95,.12);border:1px solid rgba(224,122,95,.3);color:#f0a996}
.ok-msg{font-size:13px;border-radius:9px;padding:10px 12px;margin:0 0 12px;background:rgba(74,155,111,.12);border:1px solid rgba(74,155,111,.35);color:#9fd4b4}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.subtabs button{background:var(--d2);border:1px solid var(--w08);border-radius:20px;padding:8px 14px;color:var(--w70);font-size:13px;font-weight:600;cursor:pointer}
.subtabs button.on{border-color:var(--lime);background:var(--l10);color:var(--lime)}
.find{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--w08)}
.find:first-child{border-top:none}
.find .st{flex:none;width:52px;text-align:center;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-radius:6px;padding:3px 0;height:fit-content}
.find .st.fail{background:rgba(224,122,95,.16);color:#f0a996}.find .st.warn{background:rgba(201,168,76,.16);color:#e0c67a}.find .st.pass{background:rgba(74,155,111,.16);color:#8fd6ab}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--d3);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-family:Syne,sans-serif;font-size:22px}
.kpi span{font-size:12px;color:var(--w50)}
.log{font-size:12.5px;color:var(--w50);margin-top:8px;min-height:18px}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0 18px}
.steps3 div{background:var(--d3);border-radius:12px;padding:14px}
.steps3 b{font-family:Syne,sans-serif;color:var(--lime);font-size:13px}
.steps3 p{font-size:13px;color:var(--w70);margin-top:4px}
.prog{height:6px;background:var(--d4);border-radius:6px;overflow:hidden;margin:8px 0;display:none}
.prog i{display:block;height:100%;width:0;background:var(--lime);transition:width .2s}
.srow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;padding:8px 0;border-top:1px solid var(--w08)}
model-viewer{width:100%;height:420px;background:#0d0d11;border-radius:14px;--poster-color:transparent}
#m-bg{position:fixed;inset:0;background:rgba(5,5,8,.72);backdrop-filter:blur(4px);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
#m{width:100%;max-width:500px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--d2);border:1px solid var(--w15);border-radius:20px;padding:26px;position:relative}
#m h3{font-family:Syne,sans-serif;font-size:21px;letter-spacing:-.02em;line-height:1.25;margin-bottom:6px;padding-right:40px}
#m p{color:var(--w70);font-size:14px;margin-bottom:14px}
#m .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:9px;border:1px solid var(--w08);background:var(--d3);color:var(--w70);font-size:18px;cursor:pointer}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--d4);border:1px solid var(--w15);color:var(--white);font-size:13px;padding:10px 16px;border-radius:10px;z-index:70;display:none;max-width:calc(100vw - 32px)}
@media(max-width:860px){.two{grid-template-columns:1fr}.form3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){
  .bar{padding:10px 14px}.tabs{padding:0 6px}main{padding:22px 16px 72px}h1{font-size:24px}
  .card{padding:18px 16px}.form3,.steps3{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr 1fr}
  .item{flex-wrap:wrap}.srow{grid-template-columns:1fr 1fr}#admin-views{display:none}.right .who{display:none}model-viewer{height:320px}
}
</style>

<style id="brand-v2">
:root{--black:#000000;--d1:#000000;--d2:#1A1A1A;--d3:#262626;--d4:#333333;--white:#D9DAD4;--sage:#A39684;--stone:#6D604F;--limestone:#D9DAD4;--graphite:#333333;
 --w08:rgba(217,218,212,.10);--w15:rgba(217,218,212,.18);--w30:rgba(217,218,212,.34);--w50:rgba(217,218,212,.6);--w70:rgba(217,218,212,.8)}
html,body{background:#000}
.nav,.top{background:rgba(0,0,0,.92)!important}
h1,h2,#m h3,.big{font-family:'Bungee',sans-serif!important;font-weight:400!important;letter-spacing:0!important}
.mark b,.mark span,.top-mark span{font-family:'Bungee',sans-serif!important;font-weight:400!important;letter-spacing:0!important}
</style>

<body>
<div class="top">
  <div class="bar">
    <a class="mark" href="/dashboard" title="Dashboard"><b>CG</b></a>
    <div class="crumb"><a href="/dashboard">Dashboard</a> / <span id="crumb-name"></span></div>
    <div class="right"><span class="pill lime" id="role-pill"></span><span id="admin-views"></span><button class="btn sm" onclick="signOut()">Sign out</button></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>
<main id="main"><div class="muted">Loading your project…</div></main>
<div id="m-bg" role="dialog" aria-modal="true"><div id="m"></div></div>
<div id="toast"></div>
<script>
var S = window.CG_SESSION || {user:{name:'You'}, project:'', path:'', role:'client', projectInfo:{}};
var PID = S.project, ROLE = S.role, ME = S.user;
var ST = null, DEC = [], NOTES = [], MEMBERS = [], RESULTS = [], SCANS = [], SCHED = {items:[]}, TASKS = {items:[]}, TAB = 'overview', TOOL = 'codecheck';
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function jsq(s){ return esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
function decClosed(d){ return d.status==='approved'||d.status==='rejected'||d.status==='withdrawn'; }
function money(n){ return n==null||n==='' ? '—' : '$'+Math.round(n).toLocaleString('en-US'); }
function when(t){ if(!t) return ''; var d=new Date(t); return isNaN(d) ? String(t) : d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function first(n){ return String(n||'').trim().split(/\s+/)[0]; }
function dayPart(){ var h=new Date().getHours(); return h<12?'morning':h<17?'afternoon':'evening'; }
function toast(t){ var e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(function(){ e.style.display='none'; },3200); }
var isOwner = ROLE==='client', isGC = ROLE==='gc', isTrade = ROLE==='trade', isDesigner = ROLE==='designer';
var ownerAccount = (ME.projects||{})[PID]==='client';
var SCOPE = {'new-build':'New build', remodel:'Remodel', addition:'Addition', adu:'ADU', demolition:'Demolition', 'tenant-improvement':'Tenant improvement', repair:'Repair'};
var SUB = {'single-family':'Single-family','multi-family':'Multi-family',adu:'ADU','condo-townhome':'Condo / townhome',office:'Office',retail:'Retail',restaurant:'Restaurant','mixed-use':'Mixed-use',industrial:'Industrial',other:'Other'};

function api(url, body){
  var opt = body ? {method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)} : {credentials:'same-origin',cache:'no-store'};
  return fetch(url, opt).then(function(r){ return r.json().then(function(j){ j._s=r.status; return j; }).catch(function(){ return {error:'server', _s:r.status}; }); }).catch(function(){ return {error:'network'}; });
}
var P = function(extra){ return '/api/project?project='+encodeURIComponent(PID)+(extra||''); };
function load(){
  return Promise.all([
    api(P('&action=state')),
    isTrade ? Promise.resolve({decisions:[],notifications:[]}) : api('/api/decisions?project='+encodeURIComponent(PID)),
    (isOwner||isGC||isDesigner) ? api('/api/auth?action=members&project='+encodeURIComponent(PID)) : Promise.resolve({members:[]}),
    isTrade ? Promise.resolve({results:[]}) : api('/api/tools?action=results&project='+encodeURIComponent(PID)),
    api('/api/tools?action=scans&project='+encodeURIComponent(PID)),
    api('/api/tools?action=schedule&project='+encodeURIComponent(PID))
  ]).then(function(r){
    if (r[0].error) { $('main').innerHTML='<div class="card">Couldn’t load this project. <a href="/dashboard">Back to dashboard</a></div>'; return; }
    ST=r[0]; DEC=r[1].decisions||[]; NOTES=r[1].notifications||[]; MEMBERS=r[2].members||[]; RESULTS=r[3].results||[]; SCANS=r[4].scans||[]; SCHED=(r[5].schedule||{items:[]}); TASKS=(r[5].tasks||{items:[]});
    render();
  });
}
function signOut(){ api('/api/auth',{action:'logout'}).then(function(){ location.href='/'; }); }

/* ── shell ── */
function tabsFor(){
  var t = [['overview','Overview']];
  if ((isOwner && (ST.stage==='bidding' || (ST.bids||[]).length))) t.push(['proposals','Proposals']);
  if (!isTrade) t.push(['decisions','Decisions']);
  t.push(['schedule','Schedule']);
  if (isOwner||isGC||isDesigner) t.push(['controls', ownerAccount ? 'Homeowner controls' : isGC ? 'GC controls' : isDesigner ? 'Team' : 'Controls']);
  if (!isTrade) t.push(['tools','Tools']); else t.push(['tools','3D scans']);
  return t;
}
function go(t, tool){ TAB=t; if (tool) TOOL=tool; try{ history.replaceState(null,'', t==='overview'?location.pathname:'#'+(t==='tools'?'tool-'+TOOL:t)); }catch(e){} render(); window.scrollTo(0,0); }
function render(){
  var m = ST.meta || {};
  document.title = 'Common Ground — '+(m.name||'Project');
  $('crumb-name').textContent = m.name || '';
  $('role-pill').textContent = {client:'Homeowner',gc:'GC',trade:'Trade',designer:'Designer'}[ROLE] || ROLE;
  if (S.admin) $('admin-views').innerHTML = ['client','gc','designer','trade'].filter(function(r){return r!==ROLE;}).map(function(r){ return '<a class="btn sm" href="/'+esc(S.path)+'/'+(r==='client'?'homeowner':r)+location.hash+'">'+({client:'Homeowner',gc:'GC',trade:'Trade'}[r])+' view</a>'; }).join(' ');
  var tabs = tabsFor(); if (!tabs.some(function(x){return x[0]===TAB;})) TAB='overview';
  var counts = {proposals:(ST.bids||[]).length, decisions:DEC.filter(function(d){return !decClosed(d);}).length, controls:MEMBERS.length, schedule:TASKS.items.filter(function(t){return !t.done;}).length};
  $('tabs').innerHTML = tabs.map(function(t){ return '<button class="tab'+(TAB===t[0]?' on':'')+'" data-tab="'+t[0]+'" onclick="go(\''+t[0]+'\')">'+t[1]+(counts[t[0]]?'<span class="ct">'+counts[t[0]]+'</span>':'')+'</button>'; }).join('');
  $('main').innerHTML = ({overview:vOverview, proposals:vProposals, decisions:vDecisions, controls:vControls, schedule:vSchedule, tools:vTools}[TAB])();
  if (TAB==='tools' && TOOL==='scan') afterScanRender();
  if (TAB==='overview' && typeof subRenderList==='function') subRenderList();
}

/* ── Overview ── */
function codeBasis(m){
  return m.classification==='commercial'
    ? 'Commercial: building code (CBC / IBC), accessibility (CBC 11B / ADA), fire (CFC), energy (Title 24) + local code'
    : 'Residential: residential code (CRC / IRC), energy (Title 24 Part 6), CALGreen + local code';
}
function vOverview(){
  var m = ST.meta || {}, s = m.status, stages = [['bidding','Collecting bids'],['kickoff','Kickoff'],['active','In progress']];
  var si = stages.map(function(x){return x[0];}).indexOf(ST.stage);
  var h = '<div class="eyebrow">'+esc(m.address)+'</div><h1>Good '+dayPart()+', '+esc(first(ME.name))+'.</h1>'+
    '<div class="lede">'+esc(briefLine())+'</div>'+
    '<div class="pills" style="margin-top:14px"><span class="pill">'+(m.classification==='commercial'?'Commercial':'Residential')+(m.subtype?' · '+esc(SUB[m.subtype]||m.subtype):'')+'</span>'+(m.scope?'<span class="pill">'+esc(SCOPE[m.scope]||m.scope)+'</span>':'')+
      (ST.hiredGc?'<span class="pill lime">GC · '+esc(ST.hiredGc.company||ST.hiredGc.name)+'</span>':'')+'</div>'+
    (ST.hiredGc && ST.hiredGc.hiredBy==='self' ? '' : '<div class="stages" id="stages">')+(ST.hiredGc && ST.hiredGc.hiredBy==='self' ? '' : stages.map(function(x,i){ return '<span class="'+(i<si?'done':i===si?'on':'')+'">'+(i<si?'✓ ':'')+x[1]+'</span>'; }).join('')+'</div>');
  h += '<div class="two" style="margin-top:26px"><div>';
  // next step
  if (ST.stage==='bidding' && (isOwner||S.admin)) {
    var n = (ST.bids||[]).length;
    h += '<div class="card hi" id="next-step"><div class="eyebrow">Next step</div><h2>'+(n?'You have '+n+' proposal'+(n>1?'s':'')+' to review':'Share your bid link with contractors')+'</h2>'+
      '<p class="muted small" style="margin-bottom:14px">'+(n?'Open each one, then hire or pass. Every GC hears back automatically.':'One link for every GC. They upload their proposal and it lands in your Proposals list.')+'</p>'+
      '<button class="btn pri" onclick="go(\'proposals\')">'+(n?'Review proposals':'Get your bid link')+'</button></div>';
  }
  if (ST.stage==='bidding' && isGC) h += '<div class="card">This project is collecting bids. You’ll see it here once the owner hires a GC.</div>';
  if (isDesigner) h += hasOwner()
    ? '<div class="card hi" id="next-step"><div class="eyebrow">Next step</div><h2>Scan and measure the rooms</h2><p class="muted small" style="margin-bottom:14px">Upload a LiDAR scan, measure walls in 3D or on the 2D plan, check them against the drawings, then send design approvals for your client to sign.</p><button class="btn pri" onclick="go(\'tools\',\'scan\')">Open 3D scan + measure</button></div>'
    : '<div class="card hi" id="next-step"><div class="eyebrow">Next step</div><h2>Bring your client in</h2><p class="muted small" style="margin-bottom:14px">Your client gets their own sign-in to see your measurements and sign off on design approvals.</p><button class="btn pri" onclick="go(\'controls\')">Invite your client</button></div>';
  // progress
  if (s || ST.stage==='active') {
    var pct = s ? s.percent : 0;
    h += '<div class="card" id="progress-card"><div class="eyebrow">Progress</div><div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="big" id="pct">'+pct+'%</div><div class="muted small" id="phase">'+esc(s?s.phase:'Started')+'</div></div>'+

function photoUrl(pid){ return '/api/decisions?project='+encodeURIComponent(PID)+'&action=photo&photo='+encodeURIComponent(pid); }
function shrinkPhoto(file){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){ var s = Math.min(1, 1280/Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res({type:'image/jpeg', data:c.toDataURL('image/jpeg', .82).split(',')[1]}); };
    img.onerror = function(){ rej(new Error('That file isn’t an image we can read.')); }; img.src = url;
  });
}

    .then(function(j){ if (!j.ok) return toast(j.error==='too_many_photos'?'Already 6 photos on this one.':'Couldn’t add that photo.'); var k = DEC.findIndex(function(x){return x.id===id;}); if (k>=0) DEC[k] = j.decision; openDec(id); toast('Photo added'); render(); })

function overrideDec(id, action){
  var n = $('d-note').value.trim();
  if (action!=='reopen' && n.length<3) { var m=$('d-msg'); m.style.display='block'; m.textContent='Write the reason in the comment box first — '+(action==='withdraw'?'the owner':'the GC')+' sees it.'; return; }
  api('/api/decisions', {project:PID, action:action, id:id, note:n}).then(function(j){
    if (!j.ok) { var m=$('d-msg'); m.style.display='block'; m.textContent='Couldn’t do that.'; return; }
    closeModal(); toast({reject:'Rejected — GC notified', void:'Approval voided — GC notified', withdraw:'Withdrawn — owner notified', reopen:'Reopened'}[action]); load();
  });
}
function commentDec(id){ var n=$('d-note').value.trim(); if (!n) return; api('/api/decisions', {project:PID, action:'comment', id:id, note:n}).then(function(){ closeModal(); toast('Comment sent'); load(); }); }

/* ── Controls: each role's own admin page (owner > GC > trade) ── */
var TEAM_LINK = '';
var RL = {client:'Homeowner', gc:'GC', trade:'Trade / Sub', designer:'Designer'};
function myRank(){ return S.admin ? 9 : ({client:3, gc:2, designer:2, trade:1}[(ME.projects||{})[PID]] || 0); }
function canActOn(m){
  if (m.identifier===ME.identifier) return false;
  if (S.admin || ownerAccount) return true;
  if (!isGC || m.role==='client' || m.role==='designer') return false;
  return !(ST.hiredGc && ST.hiredGc.identifier===m.identifier);
}
function rolesICanGive(){ return (S.admin||ownerAccount) ? ['client','gc','designer','trade'] : isGC ? ['gc','designer','trade'] : []; }
function hasOwner(){ return MEMBERS.some(function(m){ return m.role==='client' && m.status==='active'; }); }
function vControls(){
  var m = ST.meta||{};
  var h = '<div class="eyebrow">'+(ownerAccount?'Homeowner controls':isDesigner?'Team':'GC controls')+'</div><h1>'+(ownerAccount?'You have final say on this project':isDesigner?'Your client and trades':'Run your team and trades')+'</h1>'+
    '<div class="lede">'+(ownerAccount ? 'Add or remove anyone, change roles, reject or void decisions, and release the GC if you need to.'

      : hasOwner() ? 'Invite trades and your GC team, send change orders, and keep the schedule current. The homeowner has final say on approvals.'
      : 'No homeowner has joined yet. Invite them below — once they join, they have final say on approvals.')+'</div>';
  h += '<div class="two" style="margin-top:24px"><div>';
  // team + roles
  h += '<div class="card" id="team-card"><h2>Team + roles</h2>'+(MEMBERS.length ? MEMBERS.map(function(x){

      : '<span class="pill lime">'+esc(RL[x.role]||x.role)+'</span>';
    return '<div class="item" data-member="'+esc(x.identifier)+'"><div class="main"><div class="t">'+esc(x.name)+(x.identifier===ME.identifier?' <span class="muted small">(you)</span>':'')+'</div><div class="muted small">'+esc(x.identifier)+(ST.hiredGc&&ST.hiredGc.identifier===x.identifier?' · hired GC':'')+'</div></div>'+
      sel+'<span class="pill '+(x.status==='active'?'ok':'gray')+'">'+(x.status==='active'?'Active':'Invited')+'</span>'+
      (act?'<button class="btn sm danger" onclick="removeMember(\''+jsq(x.identifier)+'\',\''+jsq(x.name)+'\')">Remove</button>':'')+'</div>';
  }).join('') : '<div class="empty">Just you so far.</div>')+'</div>';
  // overrides (owner)
  if (ownerAccount) {
    var od = DEC.slice().sort(function(a,b){ return decClosed(a)-decClosed(b); });
    h += '<div class="card" id="override-card"><h2>Decisions — your final say</h2>'+(od.length ? od.map(function(d){
      var a = d.status==='approved' ? ['void','Void approval'] : decClosed(d) ? ['reopen','Reopen'] : ['reject','Reject'];
      return '<div class="item" data-ov="'+esc(d.id)+'"><div class="main"><div class="t">'+esc(d.title)+'</div><div class="muted small">'+money(d.amount)+'</div></div>'+decPill(d)+
        '<button class="btn sm" onclick="openDec(\''+jsq(d.id)+'\')">Open</button><button class="btn sm danger" onclick="quickOverride(\''+jsq(d.id)+'\',\''+a[0]+'\')">'+a[1]+'</button></div>';
    }).join('') : '<div class="empty">No decisions yet.</div>')+'</div>';
  }
  h += '</div><div>';
  // invite
  var give = (S.admin||ownerAccount||isGC) ? ['client','gc','designer','trade'] : isDesigner ? ['client','trade'] : [];
  h += '<div class="card"><h2>Invite someone</h2><p class="muted small" style="margin-bottom:12px">Choose who they are — that sets what they see and what they can approve.</p><div class="msg" id="t-msg"></div>'+
    '<label for="t-role">They are the…</label><select id="t-role">'+give.map(function(r){ return '<option value="'+r+'"'+((isDesigner ? r===(hasOwner()?'trade':'client') : (isGC&&!hasOwner()&&r==='client')||(!isGC&&r==='gc'))?' selected':'')+'>'+{client:'Homeowner (final say on approvals)', gc:'General contractor / GC team', designer:'Designer (interior / architectural)', trade:'Trade / sub'}[r]+'</option>'; }).join('')+'</select>'+
    '<label for="t-name">Name</label><input id="t-name"><label for="t-id">Email or phone</label><input id="t-id"><button class="btn pri" id="t-go" onclick="teamInvite()">Create invite link</button>'+
    (TEAM_LINK?'<div class="linkbox" style="margin-top:12px"><input id="team-link" readonly value="'+esc(TEAM_LINK)+'"><button class="btn sm" onclick="copy(\'team-link\')">Copy</button></div><div class="muted small" style="margin-top:6px">Text or email this link — it lets them set a password and join.</div>':'')+'</div>';
  // project details
  if (!m.builtin && (S.admin || ownerAccount || (isGC && !hasOwner()))) {
    var SUBS = {residential:[['single-family','Single-family'],['multi-family','Multi-family'],['adu','ADU'],['condo-townhome','Condo / townhome']], commercial:[['office','Office'],['retail','Retail'],['restaurant','Restaurant'],['mixed-use','Mixed-use'],['industrial','Industrial'],['other','Other']]};
    h += '<div class="card" id="details-card"><h2>Project details</h2><label for="pd-name">Name</label><input id="pd-name" value="'+esc(m.name)+'">'+
      '<label for="pd-class">Property type</label><select id="pd-class" onchange="pdSubs()"><option value="residential"'+(m.classification==='residential'?' selected':'')+'>Residential</option><option value="commercial"'+(m.classification==='commercial'?' selected':'')+'>Commercial</option></select>'+
      '<label for="pd-sub">Type</label><select id="pd-sub"></select>'+
      '<label for="pd-scope">Work</label><select id="pd-scope">'+Object.keys(SCOPE).map(function(k){ return '<option value="'+k+'"'+(m.scope===k?' selected':'')+'>'+SCOPE[k]+'</option>'; }).join('')+'</select>'+
      '<button class="btn pri" id="pd-save" onclick="saveDetails()">Save details</button></div>';
    window.PD_SUBS = SUBS; setTimeout(function(){ pdSubs(m.subtype); }, 0);
  }
  // release GC (owner)
  if (ownerAccount && ST.hiredGc && !m.builtin) h += '<div class="card" style="border-color:rgba(224,122,95,.3)" id="release-card"><h2>Release the GC</h2><p class="muted small" style="margin-bottom:12px">Ends '+esc(ST.hiredGc.company||ST.hiredGc.name)+'’s access and reopens the project for bids. Everything so far stays on record.</p><button class="btn danger" onclick="releaseGC()">Release '+esc(ST.hiredGc.company||ST.hiredGc.name)+'</button></div>';
  return h+'</div></div>';
}
function pdSubs(cur){ var c=$('pd-class'), sel=$('pd-sub'); if (!c||!sel) return; var list=PD_SUBS[c.value]; sel.innerHTML=list.map(function(x){ return '<option value="'+x[0]+'"'+(x[0]===cur?' selected':'')+'>'+x[1]+'</option>'; }).join(''); }
function saveDetails(){ api(P(), {project:PID, action:'update-meta', name:$('pd-name').value, classification:$('pd-class').value, subtype:$('pd-sub').value, scope:$('pd-scope').value}).then(function(j){ toast(j.ok?'Details saved':'Couldn’t save — '+(j.error==='owner_only'?'the homeowner manages details now':'try again')); if (j.ok) load(); }); }
function teamInvite(){
  api('/api/auth', {action:'invite', project:PID, role:$('t-role').value, name:$('t-name').value, identifier:$('t-id').value}).then(function(j){
    if (!j.ok) { var m=$('t-msg'); m.style.display='block'; m.textContent={name_required:'Add their name.', bad_identifier:'Enter a valid email or phone.', forbidden:'You can’t invite that role.'}[j.error]||'Couldn’t create the invite.'; return; }
    TEAM_LINK = j.link; load();
  });
}
function setMemberRole(id, role){ api('/api/auth', {action:'set-role', project:PID, identifier:id, role:role}).then(function(j){ toast(j.ok?'Role updated':'You can’t make that change'); load(); }); }
function removeMember(id, name){ modal('<h3>Remove '+esc(name)+'?</h3><p>They lose access to this project right away.</p><div class="acts"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" id="rm-go" onclick="api(\'/api/auth\',{action:\'remove\',project:PID,identifier:\''+jsq(id)+'\'}).then(function(j){closeModal();toast(j.ok?\'Removed\':\'You can’t remove them\');load();})">Remove</button></div>'); }
function quickOverride(id, action){
  var d = DEC.filter(function(x){return x.id===id;})[0];
  modal('<div class="eyebrow">'+({reject:'Reject',void:'Void approval',reopen:'Reopen'}[action])+'</div><h3>'+esc(d.title)+'</h3><p>'+(action==='reopen'?'Puts it back in front of you for a decision.':'The GC is notified with your reason.')+'</p>'+
    (action!=='reopen'?'<label for="d-note">Reason</label><textarea id="d-note" rows="2"></textarea>':'<textarea id="d-note" style="display:none"></textarea>')+'<div class="msg" id="d-msg"></div>'+
    '<div class="acts"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" id="qo-go" onclick="overrideDec(\''+jsq(id)+'\',\''+action+'\')">Confirm</button></div>');
}
function releaseGC(){
  modal('<div class="eyebrow">Release the GC</div><h3>Release '+esc(ST.hiredGc.company||ST.hiredGc.name)+'?</h3><p>They lose access and the project goes back to collecting bids. Tell them why — they’re notified.</p><label for="rel-why">Reason</label><textarea id="rel-why" rows="2"></textarea><div class="msg" id="rel-msg"></div>'+
    '<div class="acts"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" id="rel-go" onclick="doRelease()">Release GC</button></div>');
}
function doRelease(){ api(P(), {project:PID, action:'owner-release', reason:$('rel-why').value}).then(function(j){ if (!j.ok) { var m=$('rel-msg'); m.style.display='block'; m.textContent=j.error==='reason_required'?'Add a short reason.':'Couldn’t release — try again.'; return; } closeModal(); toast('GC released — back to collecting bids'); load(); }); }

/* ── Schedule: timeline + tasks ── */
var SCHED_EDIT = false, SCHED_DRAFT = null;
var SCOL = {planned:'var(--w30)', 'in-progress':'var(--lime)', done:'#6D604F', delayed:'#E07A5F'};
var SLBL = {planned:'Planned', 'in-progress':'In progress', done:'Done', delayed:'Delayed'};
function canPlan(){ return isGC || ownerAccount || S.admin; }
function dnum(d){ return d ? Date.parse(d+'T12:00:00Z') : NaN; }
function vSchedule(){
  var h = '<div class="eyebrow">Schedule</div><h1>Timeline + tasks</h1><div class="lede">'+(canPlan()?'Plan the phases, assign tasks, and everyone on the project sees the same schedule.':'The project schedule and the tasks assigned to you.')+'</div>';
  h += '<div class="card" style="margin-top:22px" id="timeline-card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Timeline</h2>'+
    (canPlan()&&!SCHED_EDIT?'<div class="row">'+(!SCHED.items.length?'<button class="btn sm" id="sched-template" onclick="schedTemplate()">Start from a template</button>':'')+'<button class="btn sm pri" id="sched-edit" onclick="schedEdit()">'+(SCHED.items.length?'Edit schedule':'Add phases')+'</button></div>':'')+'</div>';
  h += SCHED_EDIT ? schedEditor() : gantt();
  h += '</div>';
  // tasks
  var mine = TASKS.items.filter(function(t){ return canPlan() || t.assignee===ME.identifier; });
  h += '<div class="two"><div class="card" id="tasks-card"><h2>Tasks <span class="muted small">· '+mine.filter(function(t){return !t.done;}).length+' open</span></h2>'+
    (mine.length ? mine.map(function(t){
      var mayToggle = canPlan() || t.assignee===ME.identifier, late = t.due && !t.done && dnum(t.due) < Date.now()-86400000;
      return '<div class="item" data-task="'+esc(t.id)+'"><input type="checkbox" style="width:18px;height:18px;margin:0;flex:none;accent-color:#D5DC99" '+(t.done?'checked ':'')+(mayToggle?'':'disabled ')+'onchange="taskToggle(\''+jsq(t.id)+'\')" aria-label="Done">'+
        '<div class="main"><div class="t" style="'+(t.done?'text-decoration:line-through;color:var(--w50)':'')+'">'+esc(t.title)+(t.priority==='high'?' <span class="pill del">High</span>':'')+'</div><div class="muted small">'+(t.assigneeName?esc(t.assigneeName)+' · ':'')+(t.due?'<span style="'+(late?'color:#f0a996':'')+'">due '+esc(when(t.due))+'</span> · ':'')+'from '+esc(t.createdBy)+'</div></div>'+
        (canPlan()?'<button class="btn sm" aria-label="Delete task" onclick="taskDelete(\''+jsq(t.id)+'\')">×</button>':'')+'</div>';
    }).join('') : '<div class="empty">'+(canPlan()?'No tasks yet.':'Nothing assigned to you.')+'</div>')+'</div><div>';
  if (canPlan()) h += '<div class="card"><h2>Add a task</h2><label for="tk-title">Task</label><input id="tk-title" placeholder="e.g. Order 200A panel">'+
    '<label for="tk-who">Assign to</label><select id="tk-who"><option value="">Unassigned</option>'+MEMBERS.map(function(x){ return '<option value="'+esc(x.identifier)+'" data-name="'+esc(x.name)+'">'+esc(x.name)+' · '+esc(RL[x.role]||x.role)+'</option>'; }).join('')+'</select>'+
    '<div class="row" style="gap:10px;align-items:flex-end"><div style="flex:1;min-width:140px"><label for="tk-due">Due</label><input id="tk-due" type="date"></div><div style="flex:1;min-width:120px"><label for="tk-pri">Priority</label><select id="tk-pri"><option value="normal">Normal</option><option value="high">High</option></select></div></div>'+
    '<button class="btn pri" id="tk-go" onclick="taskAdd()">Add task</button></div>';
  return h+'</div></div>';
}
function gantt(){
  var it = SCHED.items.filter(function(x){ return x.start && x.end; });
  if (!SCHED.items.length) return '<div class="empty">No schedule yet.'+(canPlan()?' Add phases or start from a template.':'')+'</div>';
  var min = Math.min.apply(null, it.map(function(x){return dnum(x.start);})), max = Math.max.apply(null, it.map(function(x){return dnum(x.end);}));
  if (!it.length) { min = Date.now(); max = min + 86400000*30; }
  var span = Math.max(max-min, 86400000), today = Date.now(), tpos = (today-min)/span*100;
  var months = [], d = new Date(min); d.setUTCDate(1);
  while (d.getTime() <= max) { var p=(d.getTime()-min)/span*100; if (p>=0) months.push([p, d.toLocaleDateString('en-US',{month:'short',timeZone:'UTC'})]); d.setUTCMonth(d.getUTCMonth()+1); }
  var rows = SCHED.items.map(function(x){
    var has = x.start && x.end, l = has?(dnum(x.start)-min)/span*100:0, w = has?Math.max((dnum(x.end)-dnum(x.start))/span*100, 1.5):0;
    return '<div class="grow" data-phase="'+esc(x.id)+'" style="display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--w08)">'+
      '<div style="min-width:0"><div style="font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x.name)+'</div><div class="muted" style="font-size:11.5px">'+(x.trade?esc(x.trade)+' · ':'')+'<span style="color:'+SCOL[x.status]+'">'+SLBL[x.status]+'</span>'+(has?' · '+esc(when(x.start))+'–'+esc(when(x.end)):'')+'</div></div>'+
      '<div style="position:relative;height:22px;background:var(--d3);border-radius:6px;overflow:hidden">'+(has?'<div style="position:absolute;top:3px;bottom:3px;left:'+l+'%;width:'+w+'%;background:'+SCOL[x.status]+';border-radius:4px;opacity:'+(x.status==='planned'?'.55':'1')+'"></div>':'')+
        (tpos>=0&&tpos<=100?'<div style="position:absolute;top:0;bottom:0;left:'+tpos+'%;width:2px;background:#E07A5F"></div>':'')+'</div></div>';
  }).join('');
  return '<div style="display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:12px;margin-bottom:4px"><div></div><div style="position:relative;height:16px">'+months.map(function(m){ return '<span class="muted" style="position:absolute;left:'+m[0]+'%;font-size:11px">'+m[1]+'</span>'; }).join('')+'</div></div>'+rows+
    '<div class="muted small" style="margin-top:10px"><span style="display:inline-block;width:10px;height:10px;background:#E07A5F;border-radius:2px;vertical-align:middle"></span> today'+(SCHED.by?' · updated by '+esc(SCHED.by)+' '+esc(when(SCHED.updatedAt)):'')+'</div>';
}
function schedEdit(){ SCHED_DRAFT = JSON.parse(JSON.stringify(SCHED.items)); if (!SCHED_DRAFT.length) SCHED_DRAFT.push({name:'',trade:'',start:'',end:'',status:'planned'}); SCHED_EDIT = true; render(); }
function schedTemplate(){
  var base = new Date(); base.setUTCHours(12,0,0,0);
  var steps = ((ST.meta||{}).classification==='commercial') ? [['Design + plans',21],['Permitting',42],['Demolition',10],['Rough-ins (MEP)',21],['Inspections',7],['Finishes',28],['Punch list',7],['Closeout',5]]
    : [['Design + plans',21],['Permitting',35],['Demolition',7],['Framing',14],['Rough-ins (MEP)',14],['Inspections',5],['Insulation + drywall',10],['Finishes',21],['Punch list',7]];
  var t = base.getTime(); SCHED_DRAFT = steps.map(function(sx){ var s0=new Date(t), e0=new Date(t+sx[1]*86400000); t = e0.getTime()+86400000; return {name:sx[0], trade:'', start:s0.toISOString().slice(0,10), end:e0.toISOString().slice(0,10), status:'planned'}; });
  SCHED_EDIT = true; render();
}
function schedEditor(){
  return '<div id="sched-rows">'+SCHED_DRAFT.map(function(x,i){
    return '<div class="srow">'+
      '<div><label>Phase</label><input data-f="name" data-i="'+i+'" value="'+esc(x.name)+'" style="margin:0"></div><div><label>Trade</label><input data-f="trade" data-i="'+i+'" value="'+esc(x.trade||'')+'" style="margin:0"></div>'+
      '<div><label>Start</label><input type="date" data-f="start" data-i="'+i+'" value="'+esc(x.start||'')+'" style="margin:0"></div><div><label>End</label><input type="date" data-f="end" data-i="'+i+'" value="'+esc(x.end||'')+'" style="margin:0"></div>'+
      '<div><label>Status</label><select data-f="status" data-i="'+i+'" style="margin:0">'+Object.keys(SLBL).map(function(k){ return '<option value="'+k+'"'+(x.status===k?' selected':'')+'>'+SLBL[k]+'</option>'; }).join('')+'</select></div>'+
      '<button class="btn sm" aria-label="Remove phase" onclick="schedGrab();SCHED_DRAFT.splice('+i+',1);render()">×</button></div>';
  }).join('')+'</div><div class="msg" id="sched-msg"></div><div class="row" style="margin-top:12px"><button class="btn sm" onclick="schedGrab();SCHED_DRAFT.push({name:\'\',trade:\'\',start:\'\',end:\'\',status:\'planned\'});render()">+ Add phase</button><span style="flex:1"></span><button class="btn sm" onclick="SCHED_EDIT=false;render()">Cancel</button><button class="btn sm pri" id="sched-save" onclick="schedSave()">Save + share</button></div>';
}
function schedGrab(){ document.querySelectorAll('#sched-rows [data-f]').forEach(function(el){ SCHED_DRAFT[+el.getAttribute('data-i')][el.getAttribute('data-f')] = el.value; }); }
function schedSave(){
  schedGrab();
  api('/api/tools', {project:PID, action:'schedule-save', items:SCHED_DRAFT}).then(function(j){
    if (!j.ok) { var m=$('sched-msg'); m.style.display='block'; m.textContent = j.error==='end_before_start' ? '“'+j.item+'” ends before it starts.' : 'Couldn’t save the schedule.'; return; }
    SCHED = j.schedule; SCHED_EDIT = false; toast('Schedule saved — everyone on the project sees it'); render();
  });
}
function taskAdd(){
  var t=$('tk-title').value.trim(); if (!t) return toast('Describe the task first.');
  var sel=$('tk-who'), opt=sel.options[sel.selectedIndex];
  api('/api/tools', {project:PID, action:'task-add', title:t, assignee:sel.value, assigneeName:sel.value?opt.getAttribute('data-name'):'', due:$('tk-due').value, priority:$('tk-pri').value}).then(function(j){ if (!j.ok) return toast('Couldn’t add that.'); TASKS=j.tasks; render(); toast('Task added'); });
}
function taskToggle(id){ api('/api/tools', {project:PID, action:'task-toggle', id:id}).then(function(j){ if (j.ok) { TASKS=j.tasks; render(); } else toast('You can’t change that task.'); }); }
function taskDelete(id){ api('/api/tools', {project:PID, action:'task-delete', id:id}).then(function(j){ if (j.ok) { TASKS=j.tasks; render(); } }); }

/* ── Tools ── */
function vTools(){
  if (isTrade) { TOOL='scan'; return '<div class="eyebrow">3D scans</div><h1>Site scans</h1><div style="margin-top:20px">'+scanPanel()+'</div>'; }

    '<div class="subtabs" style="margin-top:20px">'+T.map(function(t){ return '<button class="'+(TOOL===t[0]?'on':'')+'" data-tool="'+t[0]+'" onclick="go(\'tools\',\''+t[0]+'\')">'+t[1]+(t[0]==='history'&&RESULTS.length?' · '+RESULTS.length:'')+'</button>'; }).join('')+'</div>'+

var LAST = {codecheck:null, plans:null};
function cityFromAddress(a){ var p=String(a||'').split(','); return p.length>=2 ? p.slice(1).join(',').trim() : ''; }
function aiPanel(){
  var cc = TOOL==='codecheck', m = ST.meta||{};
  var h = '<div class="two"><div><div class="card">'+
    '<h2>'+(cc?'Check plans against code':'Analyze a plan set')+'</h2><p class="muted small" style="margin-bottom:14px">'+(cc?esc(codeBasis(m))+'.':'Pull out square footage, rooms, scope by trade, open questions and risks.')+'</p>'+

function uploadScan(){
  var f=$('scan-file').files[0], log=$('scan-log'), btn=$('scan-go'), bar=$('scan-prog');

function fetchScan(s){

    h += head('Invite your own', st.fromOpt ? 'Invite ' + subEsc(st.name) : 'Add a trade to this project', 'They get their own sign-in with the trades view: their tasks and scope, no pricing.') +

function subSendInvite(){
  subCollect();
  var st = SUB_STATE, trade = subTradeValue(), name = (st.name || '').trim(), contact = (st.contact || '').trim();
  if (!trade) { st.err = 'Choose the trade.'; return subRenderModal(); }
  if (!name || !contact) { st.err = 'Add their name and an email or mobile number.'; return subRenderModal(); }
  var b = document.getElementById('sub-invite-btn'); if (b) { b.disabled = true; b.textContent = 'Creating…'; }
  fetch('/api/auth', {method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
    body:JSON.stringify({action:'invite', project:subProject(), role:'trade', trade:trade, name:name, identifier:contact})})
  .then(function(r){ return r.json(); }).then(function(j){
    if (!j.ok) { st.err = j.error === 'bad_identifier' ? 'That email or phone number doesn\'t look right.' : 'Could not create the invite (' + (j.error || 'error') + ').'; return subRenderModal(); }
    if (st.fromReq) subPost({action:'sub-invited', id:st.fromReq, option:st.fromOpt, identifier:contact}).then(subLoad);
    st.link = j.link; st.step = 'invited'; st.err = ''; subClearDraft(); subRenderModal();
    if (typeof teamLoad === 'function') teamLoad();
  }).catch(function(){ st.err = 'Network problem — try again.'; subRenderModal(); });
}
function subSendRequest(){
  subCollect();
  var st = SUB_STATE, trade = subTradeValue();
  if (!trade) { st.err = 'Choose the trade.'; return subRenderModal(); }
  if ((st.scope || '').trim().length < 5) { st.err = 'Add a sentence about the job.'; return subRenderModal(); }
  if (!/\b\d{5}\b/.test(st.zip || '')) { st.err = 'Add the 5-digit zip code for the job.'; return subRenderModal(); }
  var b = document.getElementById('sub-req-btn'); if (b) { b.disabled = true; b.textContent = 'Sending…'; }
  subPost({action:'sub-request', trade:trade, scope:st.scope, zip:st.zip, timing:st.timing, budget:st.budget, phone:st.phone}).then(function(j){
    if (!j.ok) { st.err = j.error === 'too_many' ? 'That\'s a lot of requests today — email us at commonground.helpme@gmail.com.' : 'Could not send the request (' + (j.error || 'error') + ').'; return subRenderModal(); }
    subClearDraft();
    SUB_STATE = { step:'done', dueAt:j.request.dueAt, doneTrade:j.request.trade };
    subRenderModal(); subLoad();
  }).catch(function(){ st.err = 'Network problem — try again.'; subRenderModal(); });
}
function subCancel(id){
  if (!confirm('Cancel this request?')) return;
  subPost({action:'sub-cancel', id:id}).then(subLoad);
}
function subInviteOption(reqId, optId){
  var r = SUB_REQS.filter(function(x){ return x.id === reqId; })[0]; if (!r) return;
  var o = (r.options || []).filter(function(x){ return x.id === optId; })[0]; if (!o) return;
  subOpen({option:o, reqId:reqId, trade:r.trade});
}

/* ── list of requests + results (on the Progress / Overview page) ── */
function subCard(r){

    '<span style="font-size:11px;color:var(--w30);margin-left:auto">near ' + subEsc(r.zip) + '</span></div>' +

  if (r.status === 'ready') {
    if (r.message) h += '<div style="font-size:12px;color:var(--w70);line-height:1.6;margin-bottom:10px;padding:10px 12px;background:var(--l10);border:1px solid var(--l20);border-radius:9px">' + subEsc(r.message) + '</div>';
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:10px">' + r.options.map(function(o){
      var title = o.company || o.name, who = o.company && o.name ? o.name : '';

      if (o.website) links.push('<a href="' + subEsc(o.website) + '" target="_blank" rel="noopener" style="color:var(--w70)">Website ↗</a>');
      if (o.source) links.push('<a href="' + subEsc(o.source) + '" target="_blank" rel="noopener" style="color:var(--w50)">Reviews ↗</a>');
      return '<div data-subopt="' + o.id + '" style="background:var(--d2);border:1px solid var(--w08);border-radius:10px;padding:14px">' +

        (stars ? '<div style="font-size:12px;margin-top:6px">' + stars + '</div>' : '') +

        '</div>';

  }
  return h + '</div>';
}
function subRenderList(){
  var el = document.getElementById('sub-list'); if (!el) return;
  var reqs = SUB_REQS.filter(function(r){ return r.status === 'searching' || r.status === 'ready'; });
  if (!reqs.length) { el.innerHTML = ''; el.style.display = 'none'; return; }

    '<button onclick="subOpen()" style="margin-left:auto;background:none;border:1px solid var(--w15);border-radius:8px;padding:7px 12px;font-size:11px;font-weight:600;color:var(--w70);cursor:pointer;font-family:inherit">+ Find another sub</button></div>' +

/* Put the list on the page: after the first row of the Progress screen, or into #sub-list if the page has one */
function subMount(){
  if (!subCan() || document.getElementById('sub-list')) return;

function subInit(){ if (!subCan()) return; subMount(); subLoad(); setInterval(subLoad, 120000); }

<script id="scan3d-front">/* SCAN3D_START */
/* ══════════════════════════════════════════════════
   3D SCAN WORKBENCH — 3D view, 2D plan (scan cut at a height, seen from above),
   tap-to-measure, saved measurements per room + wall, typed-in measurements,
   and an AI cross-check of the measurements against architectural drawings.
   three.js loads on demand through the page's import map. Lengths are stored in meters.
   Later declarations override the page's original scanPanel / afterScanRender.
   ══════════════════════════════════════════════════ */
var MEASURES = [], M3 = { dollhouse: true, mode: '3d', measuring: false, pts: [], pending: null, units: 'ft', cut: 1.2, showSaved: true, scanId: null, dom: null, xc: null, xcBusy: false };
try { M3.units = localStorage.getItem('cg_units') === 'm' ? 'm' : 'ft'; } catch (e) {}
function m3CanWrite(){ return !isTrade; }

/* ── lengths ── */
function m3Fmt(m, units){
  units = units || M3.units;
  if (units === 'm') return (Math.round(m * 100) / 100).toFixed(2) + ' m';
  var inches = Math.round(m / 0.0254 * 2) / 2, ft = Math.floor(inches / 12), rest = inches - ft * 12;
  var r = rest % 1 ? Math.floor(rest) + '½' : String(rest);
  if (rest === 0.5) r = '½';
  return ft + '′ ' + r + '″';
}
function m3Both(m){ return m3Fmt(m, 'ft') + ' (' + m3Fmt(m, 'm') + ')'; }
function m3SetUnits(u){ M3.units = u; try { localStorage.setItem('cg_units', u); } catch (e) {} render(); }

/* ── data ── */
function m3LoadMeasures(){
  return api('/api/tools?action=measures&project=' + encodeURIComponent(PID)).then(function(j){
    if (j && j.ok) { MEASURES = j.measures || []; if (TAB === 'tools' && TOOL === 'scan') { m3RenderList(); m3DrawSaved(); } }
  });
}
var _m3Load = load;
load = function(){ var p = _m3Load.apply(this, arguments); m3LoadMeasures(); return p; };
function m3Rooms(){
  var seen = {}, out = [];
  MEASURES.forEach(function(m){ if (!seen[m.room.toLowerCase()]) { seen[m.room.toLowerCase()] = 1; out.push(m.room); } });
  (RESULTS || []).forEach(function(r){ if (r.tool === 'plans' && r.result && r.result.rooms) r.result.rooms.forEach(function(n){ if (n && !seen[String(n).toLowerCase()]) { seen[String(n).toLowerCase()] = 1; out.push(String(n)); } }); });
  return out;
}

/* ── panel ── */
function scanPanel(){

  if (SCAN_VIEW) {
    var glb = SCAN_VIEW.ext === 'glb';
    var seg = function(k, t){ return '<button class="btn sm' + (M3.mode === k ? ' pri' : '') + '" data-m3mode="' + k + '" onclick="m3Mode(\'' + k + '\')">' + t + '</button>'; };
    h += '<div class="card" id="scan-view"><div class="row" style="justify-content:space-between;margin-bottom:12px;gap:10px"><h2 style="margin:0;min-width:0">' + esc(SCAN_VIEW.label) + '</h2><button class="btn sm" onclick="SCAN_VIEW=null;m3Dispose();render()">Close</button></div>' +
      (glb ? '<div class="row m3-bar" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">' + seg('3d', '3D') + seg('2d', '2D plan') + seg('ar', 'AR view') +
        (M3.mode === '3d' ? '<label class="small" style="display:flex;align-items:center;gap:6px;margin:0 0 0 6px;cursor:pointer"><input type="checkbox" id="m3-doll" style="width:auto;margin:0"' + (M3.dollhouse ? ' checked' : '') + ' onchange="M3.dollhouse=this.checked;m3ApplyMode()">Hide ceiling</label>' : '') +
        '<span style="flex:1"></span>' +
        (M3.mode !== 'ar' ? '<button class="btn sm' + (M3.measuring ? ' pri' : '') + '" id="m3-measure" onclick="m3ToggleMeasure()">' + (M3.measuring ? 'Measuring · tap 2 points' : 'Measure') + '</button>' : '') +
        '<button class="btn sm" onclick="m3SetUnits(\'' + (M3.units === 'ft' ? 'm' : 'ft') + '\')" title="Switch units">' + (M3.units === 'ft' ? 'ft' : 'm') + '</button></div>' : '') +
      '<div id="viewer-slot"><div class="muted small">Loading model…</div></div>' +
      (glb && M3.mode === '2d' ? '<div class="row" style="gap:10px;margin-top:10px;align-items:center"><label for="m3-cut" style="margin:0;white-space:nowrap">Cut height</label><input id="m3-cut" type="range" min="0.3" max="2.4" step="0.05" value="' + M3.cut + '" oninput="m3Cut(this.value)" style="flex:1;margin:0"><span class="muted small" id="m3-cut-v" style="min-width:64px;text-align:right">' + m3Fmt(M3.cut) + '</span></div>' : '') +
      '<div id="m3-pending">' + m3PendingHtml() + '</div>' +
      '<div class="muted small" style="margin-top:8px" id="m3-hint">' + m3Hint() + '</div></div>';
  }
  h += '<div class="card"><h2>Scans on this project</h2>' + (SCANS.length ? SCANS.map(function(s){ return '<div class="item" data-scan="' + esc(s.id) + '"><div class="main"><div class="t">' + esc(s.label) + '</div><div class="muted small">' + esc(s.ext.toUpperCase()) + ' · ' + (s.size / 1048576).toFixed(1) + ' MB · ' + esc(s.by) + ' · ' + esc(when(s.at)) + '</div></div><button class="btn sm pri" onclick="viewScan(\'' + jsq(s.id) + '\')">' + (s.ext === 'usdz' ? 'Open' : 'View + measure') + '</button>' + (isGC ? '<button class="btn sm danger" onclick="delScan(\'' + jsq(s.id) + '\')">Delete</button>' : '') + '</div>'; }).join('') : '<div class="empty">No scans yet.</div>') + '</div>';
  h += '<div id="m3-list">' + m3ListHtml() + '</div>';
  h += '</div><div>';
  if (canUp) h += '<div class="card hi"><h2>Scan the site in 3D</h2><div class="steps3"><div><b>1 · Capture</b><p>Walk the space with an iPhone or iPad Pro (LiDAR) using Polycam, Scaniverse or 3d Scanner App.</p></div><div><b>2 · Export</b><p>Export as <b>GLB</b> (or USDZ). Choose medium quality to keep it under 24 MB.</p></div><div><b>3 · Upload</b><p>Everyone on the project can walk the model, see it as a 2D plan and take measurements.</p></div></div>' +
    '<label for="scan-label">Name</label><input id="scan-label" placeholder="e.g. Kitchen — existing conditions"><label for="scan-file">Scan file (.glb or .usdz · up to 24 MB)</label><input id="scan-file" type="file" accept=".glb,.usdz,model/gltf-binary,model/vnd.usdz+zip">' +
    '<div class="prog" id="scan-prog"><i></i></div><button class="btn pri" id="scan-go" onclick="uploadScan()">Upload scan</button><div class="log" id="scan-log"></div></div>';
  if (m3CanWrite()) h += '<div id="m3-xc">' + m3CrossHtml() + '</div>';

      (L.pending ? 'background:#D5DC99;color:#000' : 'background:rgba(0,0,0,.72);color:#D9DAD4;border:1px solid rgba(217,218,212,.3)') + '">' + esc(L.text) + '</span>';
  });
  V.labels.innerHTML = html;
  if (M3.mode === '2d' && V.box) {   // scale bar
    var wpp = (V.ortho.right - V.ortho.left) / V.ortho.zoom / W;   // meters per pixel
    var target = wpp * 110, steps = M3.units === 'ft' ? [1, 2, 5, 10, 20, 50].map(function(f){ return f * 0.3048; }) : [0.25, 0.5, 1, 2, 5, 10, 20];
    var len = steps.filter(function(s){ return s <= target; }).pop() || steps[0], px = len / wpp;
    V.scaleEl.innerHTML = '<div style="width:' + px.toFixed(0) + 'px;height:6px;border:2px solid #D9DAD4;border-top:none"></div><div style="margin-top:2px">' + (M3.units === 'ft' ? Math.round(len / 0.3048) + ' ft' : len + ' m') + '</div>';
  }
}
function m3PickAt(x, y){
  var V = M3.v; if (!V || !V.model) return false;
  var THREE = V.THREE, W = V.wrap.clientWidth, H = V.wrap.clientHeight;
  var rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(x / W * 2 - 1, -(y / H) * 2 + 1), m3Cam());
  var hits = rc.intersectObject(V.model, true);
  if (M3.mode === '2d' || M3.dollhouse) hits = hits.filter(function(h){ return h.point.y <= V.plane.constant + 1e-4; });
  if (!hits.length) return false;
  m3AddPoint(hits[0].point.toArray());
  return true;
}
function m3AddPoint(p){
  if (M3.pts.length >= 2) { M3.pts = []; M3.pending = null; }
  M3.pts.push(p);
  if (M3.pts.length === 2) {
    var a = M3.pts[0], b = M3.pts[1], is2d = M3.mode === '2d';
    var d = is2d ? Math.hypot(a[0] - b[0], a[2] - b[2]) : Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
    var prev = M3.lastRoom || '';
    M3.pending = { a: a, b: b, meters: d, view: is2d ? '2d' : '3d', room: prev, label: '' };
  }
  m3RedrawPick();
  var el = $('m3-pending'); if (el) el.innerHTML = m3PendingHtml();
  if (M3.pending && $('m3-room')) { (M3.pending.room ? $('m3-what') : $('m3-room')).focus({ preventScroll: true }); }
}
function m3ClearPick(){ M3.pts = []; M3.pending = null; m3RedrawPick(); var el = $('m3-pending'); if (el) el.innerHTML = ''; }
function m3Discard(){ m3ClearPick(); }
function m3Line(group, a, b, color, flat){
  var V = M3.v, THREE = V.THREE, r = V.diag * 0.006;
  var mat = new THREE.MeshBasicMaterial({ color: color, depthTest: false, transparent: true });
  [a, b].forEach(function(p){ if (!p) return; var s = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 8), mat); s.position.set(p[0], p[1], p[2]); s.renderOrder = 10; group.add(s); });
  if (a && b) {
    var bb = flat ? [b[0], a[1], b[2]] : b;
    var g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(a[0], a[1], a[2]), new THREE.Vector3(bb[0], bb[1], bb[2])]);
    var l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: color, depthTest: false, transparent: true })); l.renderOrder = 10; group.add(l);
  }
}
function m3Clear(group){ while (group.children.length) { var o = group.children.pop(); o.geometry && o.geometry.dispose(); } }
function m3RedrawPick(){
  var V = M3.v; if (!V || !V.model) return;
  m3Clear(V.overlay);
  V.labelPts = (V.labelPts || []).filter(function(L){ return !L.pending; });
  if (M3.pts.length) {
    m3Line(V.overlay, M3.pts[0], M3.pts[1], 0xD5DC99, M3.pending && M3.pending.view === '2d');
    if (M3.pending) { var a = M3.pts[0], b = M3.pts[1]; V.labelPts.push({ pending: true, at: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2], text: m3Fmt(M3.pending.meters) }); }
  }
  m3Render();
}
function m3DrawSaved(){
  var V = M3.v; if (!V || !V.model) return;
  m3Clear(V.saved);
  var pend = (V.labelPts || []).filter(function(L){ return L.pending; });
  V.labelPts = pend;
  MEASURES.forEach(function(m){
    if (m.source !== 'scan' || m.scanId !== M3.scanId || !m.a || !m.b || !M3.showSaved) return;
    m3Line(V.saved, m.a, m.b, 0xB79CFF, m.view === '2d');
    V.labelPts.push({ at: [(m.a[0] + m.b[0]) / 2, (m.a[1] + m.b[1]) / 2, (m.a[2] + m.b[2]) / 2], text: m.label + ' · ' + m3Fmt(m.meters) });
  });
  m3Render();
}
function m3SavePending(){
  var p = M3.pending, log = $('m3-log'); if (!p) return;
  p.room = ($('m3-room').value || '').trim(); p.label = ($('m3-what').value || '').trim();
  if (!p.room) { log.textContent = 'Add the room.'; $('m3-room').focus(); return; }
  $('m3-save').disabled = true;

    if (!j.ok) { $('m3-save').disabled = false; log.textContent = 'Couldn’t save (' + (j.error || 'error') + ').'; return; }
    M3.lastRoom = p.room; MEASURES = j.measures; m3ClearPick(); m3RenderList(); m3DrawSaved(); toast('Measurement saved');
  });
}

m3LoadMeasures();
