<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Common Ground — Dashboard</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Common Ground">
<meta property="og:image" content="https://www.buildcommonground.io/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Common Ground logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.buildcommonground.io/og.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#111015">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--black:#0B0B0E;--d1:#111015;--d2:#17161C;--d3:#1E1D24;--d4:#26252D;--white:#FDFFFE;--lime:#D5DC99;--sage:#737F73;
  --w08:rgba(253,255,254,.08);--w15:rgba(253,255,254,.15);--w30:rgba(253,255,254,.3);--w50:rgba(253,255,254,.55);--w70:rgba(253,255,254,.75);
  --l10:rgba(213,220,153,.1);--l20:rgba(213,220,153,.22);--ok:#4A9B6F;--del:#E07A5F;--amb:#C9A84C}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--d1);color:var(--white);font-family:"DM Sans",sans-serif;font-size:15px;line-height:1.55;overflow-x:hidden}
a{color:var(--lime)}
button,input,select{font-family:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(17,16,21,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--w08)}
.bar{max-width:1120px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:center;gap:8px;text-decoration:none}
.mark b{width:28px;height:28px;border-radius:7px;background:var(--lime);color:var(--black);display:flex;align-items:center;justify-content:center;font-family:Syne,sans-serif;font-size:11px;font-weight:800}
.mark span{font-family:Syne,sans-serif;font-size:14px;font-weight:700;color:var(--lime)}
.acct{margin-left:auto;position:relative}
.chip{display:flex;align-items:center;gap:8px;background:var(--d3);border:1px solid var(--w15);border-radius:30px;padding:5px 12px 5px 5px;color:var(--white);cursor:pointer;font-size:13px;font-weight:600;max-width:240px}
.chip i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--lime);color:var(--black);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;right:0;top:44px;width:250px;background:var(--d2);border:1px solid var(--w15);border-radius:12px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.5);display:none;z-index:30}
.menu.on{display:block}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;border:none;background:none;color:var(--w70);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--d3);color:var(--white)}
main{max-width:1120px;margin:0 auto;padding:40px 28px 90px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--sage);margin-bottom:8px}
h1{font-family:Syne,sans-serif;font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
h2{font-family:Syne,sans-serif;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.lede{color:var(--w70);margin-top:8px;max-width:620px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:1px solid var(--w15);background:var(--d3);color:var(--white);font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--black)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:34px}
.start{background:linear-gradient(135deg,rgba(213,220,153,.12),var(--d2) 60%);border:1px solid var(--l20);border-radius:20px;padding:28px 30px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.start h2{font-size:22px}
.start p{color:var(--w70);margin-top:6px;max-width:560px}
.sec{margin-bottom:40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h .ct{color:var(--w50);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pcard{background:var(--d2);border:1px solid var(--w08);border-radius:16px;padding:20px 20px 18px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.pcard:hover{border-color:var(--w30)}
.pcard .nm{font-family:Syne,sans-serif;font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.pcard .ad{font-size:13px;color:var(--w50)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid var(--w15);color:var(--w70);white-space:nowrap}
.pill.lime{background:var(--l10);border-color:var(--l20);color:var(--lime)}
.pill.ok{background:rgba(74,155,111,.14);border-color:rgba(74,155,111,.4);color:#8fd6ab}
.pill.amb{background:rgba(201,168,76,.12);border-color:rgba(201,168,76,.38);color:#e0c67a}
.pill.gray{background:var(--d3);color:var(--w50)}
.track{height:6px;background:var(--d4);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--lime)}
.pcard .go{font-size:13px;font-weight:700;color:var(--lime);margin-top:auto}
.empty{background:var(--d2);border:1px dashed var(--w15);border-radius:16px;padding:26px;color:var(--w50);text-align:center}
.bids{background:var(--d2);border:1px solid var(--w08);border-radius:16px;overflow:hidden}
.bid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) auto auto;gap:16px;align-items:center;padding:16px 20px;border-top:1px solid var(--w08)}
.bid:first-child{border-top:none}
.bid .t{font-weight:700}
.bid .m{font-size:12.5px;color:var(--w50)}
.upsell{margin-top:16px;background:var(--l10);border:1px solid var(--l20);border-radius:16px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.upsell h3{font-family:Syne,sans-serif;font-size:18px;letter-spacing:-.02em}
.upsell p{color:var(--w70);font-size:14px;margin-top:4px;max-width:560px}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tool{background:var(--d2);border:1px solid var(--w08);border-radius:16px;padding:20px;text-align:left;color:inherit;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:8px}
.tool:hover{border-color:var(--w30)}
.tool b{font-family:Syne,sans-serif;font-size:16px}
.tool span{font-size:13.5px;color:var(--w70)}
.chooser{background:var(--d2);border:1px solid var(--l20);border-radius:18px;padding:24px;margin-bottom:34px}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{background:var(--d3);border:1px solid var(--w08);border-radius:14px;padding:18px;text-align:left;color:var(--white);cursor:pointer;font:inherit}
.opt b{display:block;font-family:Syne,sans-serif;font-size:16px;margin-bottom:4px}
.opt span{display:block;font-size:13px;color:var(--w50);line-height:1.5}
.opt.on{border-color:var(--lime);background:var(--l10)}
/* modal */
#m-bg{position:fixed;inset:0;background:rgba(5,5,8,.72);backdrop-filter:blur(4px);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
#m{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--d2);border:1px solid var(--w15);border-radius:20px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.6);position:relative}
#m h3{font-family:Syne,sans-serif;font-size:22px;letter-spacing:-.02em;line-height:1.25;margin:4px 0 6px;padding-right:40px}
#m .s{font-size:14px;color:var(--w50);margin-bottom:18px}
#m label{display:block;font-size:12px;color:var(--sage);margin:0 0 6px}
#m input,#m select{width:100%;background:var(--d3);border:1px solid var(--w08);border-radius:10px;padding:12px 13px;font-size:15px;color:var(--white);outline:none;margin-bottom:14px}
#m input:focus,#m select:focus{border-color:var(--l20)}
#m .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:9px;border:1px solid var(--w08);background:var(--d3);color:var(--w70);font-size:18px;cursor:pointer}
.dots{display:flex;gap:6px;margin-bottom:6px}
.dots i{width:22px;height:4px;border-radius:4px;background:var(--d4)}
.dots i.on{background:var(--lime)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{background:var(--d3);border:1px solid var(--w08);border-radius:20px;padding:8px 14px;color:var(--w70);font-size:13px;font-weight:600;cursor:pointer}
.chips button.on{border-color:var(--lime);background:var(--l10);color:var(--lime)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.acts .btn{flex:1;padding:13px 16px;font-size:14.5px}
.btn.back{background:var(--d4);border-color:var(--w15);color:var(--w70)}
.stepno{font-size:11.5px;color:var(--w50);margin-bottom:6px}
.resume{background:var(--d2);border:1px solid var(--l20);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.resume .t{flex:1;min-width:200px}
.msg{display:none;font-size:13px;border-radius:9px;padding:10px 12px;margin-bottom:14px;background:rgba(224,122,95,.12);border:1px solid rgba(224,122,95,.3);color:#f0a996}
.note{font-size:12.5px;color:var(--w50);margin:-6px 0 14px;line-height:1.5}
input[type=range]{accent-color:#D5DC99;padding:0!important;border:none!important;background:none!important}
@media(max-width:900px){.grid,.tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){
  .bar{padding:12px 16px}main{padding:26px 16px 72px}h1{font-size:26px}
  .grid,.tools,.cards2,.row2{grid-template-columns:1fr}
  .start{padding:22px 18px}.start .btn{width:100%}
  .bid{grid-template-columns:1fr auto;gap:8px 12px}.bid .amt{display:none}
  .upsell .btn{width:100%}
  #m{padding:22px 18px}
}
</style>
<link rel="stylesheet" href="https://use.typekit.net/yiu3yds.css" id="brand-kit">
<style id="brand-v2">
:root{--black:#000000;--d1:#000000;--d2:#1A1A1A;--d3:#262626;--d4:#333333;--white:#D9DAD4;--sage:#A39684;--stone:#6D604F;--limestone:#D9DAD4;--graphite:#333333;
 --w08:rgba(217,218,212,.10);--w15:rgba(217,218,212,.18);--w30:rgba(217,218,212,.34);--w50:rgba(217,218,212,.6);--w70:rgba(217,218,212,.8)}
html,body{background:#000}
.nav,.top{background:rgba(0,0,0,.92)!important}
h1,h2,#m h3,.pcard .nm,.start h2,.upsell h3{font-family:'lulo-one',Syne,sans-serif!important;font-weight:700!important;letter-spacing:0!important}
</style>
</head>
<body>
<div class="top"><div class="bar">
  <a class="mark" href="/"><b>CG</b><span>Common Ground</span></a>
  <div class="acct"><button class="chip" id="chip" onclick="toggleMenu(event)"><i id="av"></i><span id="nm"></span></button>
    <div class="menu" id="menu"></div></div>
</div></div>
<main id="main"></main>
<div id="m-bg" role="dialog" aria-modal="true"><div id="m"></div></div>
<script>
var D = window.CG_DASH || {user:{name:'You'}, projects:[], bids:[]};
var U = D.user;
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function first(){ return String(U.name||'').trim().split(/\s+/)[0] || 'there'; }
function initials(){ return String(U.name||'?').trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('').toUpperCase(); }
function money(n){ return n==null ? '' : '$'+Math.round(n).toLocaleString('en-US'); }
function dayPart(){ var h=new Date().getHours(); return h<12?'morning':h<17?'afternoon':'evening'; }
function isGC(){ return U.accountType==='contractor'; }
var ROLE = {client:'Homeowner', gc:'GC', trade:'Trade'};
function roleUrl(r){ return r==='client' ? 'homeowner' : r; }
var SCOPE = {'new-build':'New build', remodel:'Remodel', addition:'Addition', adu:'ADU', demolition:'Demolition', 'tenant-improvement':'Tenant improvement', repair:'Repair'};

/* ── header ── */
$('av').textContent = initials(); $('nm').textContent = U.name;
$('menu').innerHTML = '<div style="padding:4px 10px 10px;border-bottom:1px solid var(--w08);margin-bottom:6px"><div style="font-weight:700;font-size:13px">'+esc(U.name)+'</div><div style="font-size:11.5px;color:var(--w50)">'+esc(U.identifier)+'</div></div>'+
  (D.admin ? '<a href="/admin">Platform console ↗</a>' : '')+'<a href="/help">Help + contact</a><button onclick="signOut()">Sign out</button>';
function toggleMenu(e){ e.stopPropagation(); $('menu').classList.toggle('on'); }
document.addEventListener('click', function(){ $('menu').classList.remove('on'); });
function signOut(){ fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'logout'})}).finally(function(){ location.href='/'; }); }

/* ── page ── */
function render(){
  var mine = D.projects.filter(function(p){ return p.member; });
  var others = D.projects.filter(function(p){ return !p.member; });
  var h = '';
  h += '<div class="hero"><div><div class="eyebrow">'+(U.accountType==='contractor'?'Contractor':U.accountType==='homeowner'?'Homeowner':'Your dashboard')+(U.company?' · '+esc(U.company):'')+'</div>'+
       '<h1>Good '+dayPart()+', '+esc(first())+'.</h1><div class="lede">'+esc(ledeText(mine))+'</div></div></div>';
  if (!U.accountType) {
    h += '<div class="chooser" id="chooser"><h2>How will you use Common Ground?</h2><div class="lede" style="margin-top:4px">We’ll set up the right tools. You can still be on any project either way.</div>'+
      '<div class="cards2"><button class="opt" id="pick-home" onclick="setType(\'homeowner\')"><b>I’m a homeowner</b><span>Start a project for my property and collect GC bids</span></button>'+
      '<button class="opt" id="pick-gc" onclick="setType(\'contractor\')"><b>I’m a contractor</b><span>Run my projects, code checks, plans and 3D scans</span></button></div></div>';
  }
  // bidders see their proposals first
  if (D.bids.length) h += bidsSection();
  var dr = (C && !C.created) ? C : draftLoad();
  if (dr && U.accountType) { C = dr; h += '<div class="resume" id="resume-card"><div class="t"><div class="eyebrow" style="margin:0 0 4px">Pick up where you left off</div><div style="font-weight:700">'+esc(dr.address || (dr.mode==='underway'?'Project already underway':'New project'))+'</div><div class="muted" style="font-size:13px;color:var(--w50)">Step '+(steps().indexOf(dr.step)+1)+' of '+steps().length+' · your answers are saved</div></div>'+
    '<button class="btn" onclick="draftDiscard()">Start over</button><button class="btn pri" id="resume-btn" onclick="openCreate()">Continue</button></div>'; }
  if (U.accountType && !D.bids.length) h += startCard();   // bidders get the upsell card instead
  h += '<div class="sec"><div class="sec-h"><h2>Your projects</h2><span class="ct">'+mine.length+'</span></div>'+
       (mine.length ? '<div class="grid" id="proj-grid">'+mine.map(projCard).join('')+'</div>'
         : '<div class="empty" id="proj-empty">'+(U.accountType==='homeowner' ? 'No projects yet. Start one for your property above — it takes two minutes.' : U.accountType==='contractor' ? 'No projects yet. Add a new one or one that’s already underway.' : 'You’re not on a project yet.')+'</div>')+'</div>';
  if (isGC() || !U.accountType) h += toolsSection(mine);
  if (others.length) h += '<div class="sec"><div class="sec-h"><h2>All platform projects</h2><span class="ct">Admin view · '+others.length+'</span></div><div class="grid">'+others.map(projCard).join('')+'</div></div>';
  $('main').innerHTML = h;
}
function ledeText(mine){
  if (U.accountType==='homeowner') return mine.length ? 'Here’s where your projects stand.' : 'Start your project, share one link with contractors, and hire with confidence.';
  if (U.accountType==='contractor') return mine.length ? 'Your projects and tools, all in one place.' : 'Add a project and start using the tools right away. Unlimited projects, free.';
  return 'Everything you’re working on, in one place.';
}
function startCard(){
  if (U.accountType==='homeowner') return '<div class="start"><div><h2>Start a project for your property</h2><p>Tell us the address and property type. We’ll set up code checks for residential or commercial, and a bid page to share with contractors.</p></div>'+
    '<button class="btn pri" id="start-btn" onclick="openCreate()">Start a project</button></div>';
  return '<div class="start"><div><h2>Add a project</h2><p>Brand new or already underway — set it up in a minute, invite your client, and run code checks, plan analysis and 3D scans.</p></div>'+
    '<button class="btn pri" id="start-btn" onclick="openCreate()">Add a project</button></div>';
}
function stageLabel(p){
  if (p.status && p.status.phase) return p.status.phase;
  return {bidding:'Collecting bids', kickoff:'Kickoff', active:'In progress'}[p.stage] || p.stage;
}
function projCard(p){
  var pct = p.status && p.status.percent!=null ? p.status.percent : null;
  return '<a class="pcard" href="/'+esc(p.path)+'/'+roleUrl(p.role||'client')+'" data-path="'+esc(p.path)+'">'+
    '<div class="pills">'+(p.role?'<span class="pill lime">'+esc(ROLE[p.role]||p.role)+'</span>':'')+(p.member?'':'<span class="pill gray">Admin</span>')+
      (p.classification?'<span class="pill">'+esc(p.classification==='commercial'?'Commercial':'Residential')+'</span>':'')+(p.scope?'<span class="pill">'+esc(SCOPE[p.scope]||p.scope)+'</span>':'')+'</div>'+
    '<div><div class="nm">'+esc(p.name)+'</div><div class="ad">'+esc(p.address)+'</div></div>'+
    '<div style="font-size:13px;color:var(--w70)">'+esc(stageLabel(p))+(p.hiredGc && p.role==='client'?' · GC: '+esc(p.hiredGc):'')+(pct!=null?' · '+pct+'%':'')+'</div>'+
    (pct!=null?'<div class="track"><div class="fill" style="width:'+pct+'%"></div></div>':'')+
    '<span class="go">Open project →</span></a>';
}
function bidsSection(){
  var TAG = {pending:['amb','Pending'], hired:['ok','Hired'], passed:['gray','Going another direction']};
  return '<div class="sec" id="my-bids"><div class="sec-h"><h2>My proposals</h2><span class="ct">'+D.bids.length+'</span></div><div class="bids">'+
    D.bids.map(function(b){
      var t = TAG[b.status] || TAG.pending;
      return '<div class="bid" data-bid="'+esc(b.bidId)+'"><div><div class="t">'+esc(b.projectName)+'</div><div class="m">'+esc(b.address)+' · submitted '+new Date(b.submittedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</div></div>'+
        '<div class="amt m">'+money(b.amount)+'</div><span class="pill '+t[0]+'">'+t[1]+'</span>'+
        (b.hasFile?'<a class="btn sm" target="_blank" rel="noopener" href="/api/project?action=file&project='+encodeURIComponent(b.project)+'&bid='+encodeURIComponent(b.bidId)+'">View proposal</a>':'<span></span>')+'</div>';
    }).join('')+'</div>'+
    '<div class="upsell"><div><h3>Win or not, run every job here — free.</h3><p>Add your own projects and use the same tools homeowners see: code checks before you submit, plan analysis by trade, 3D scans, timelines and task lists, and one-tap owner approvals.</p></div>'+
    '<button class="btn pri" id="upsell-btn" onclick="'+(U.accountType?'openCreate()':'setType(\'contractor\',true)')+'">Add a project</button></div></div>';
}
function toolsSection(mine){
  var list = [['schedule','Timeline + tasks','Plan the phases, assign tasks, one schedule for everyone.'],['codecheck','Code check','Plans in, findings with code references out.'],['plans','Plan analysis','Square footage, rooms and scope by trade.'],['scan','3D scan','Upload an iPhone LiDAR scan and share the model.']];
  return '<div class="sec"><div class="sec-h"><h2>Free tools</h2><span class="ct">Open inside any project</span></div><div class="tools">'+
    list.map(function(t){ return '<button class="tool" id="tool-'+t[0]+'" onclick="openTool(\''+t[0]+'\')"><b>'+t[1]+'</b><span>'+t[2]+'</span></button>'; }).join('')+'</div></div>';
}
function openTool(t){
  var mine = D.projects.filter(function(p){ return p.member && (p.role==='gc'||p.role==='client'); });
  if (!mine.length) { if (!U.accountType) return setType('contractor', true); return openCreate(t); }
  var hash = t==='schedule' ? '#schedule' : '#tool-'+t;
  if (mine.length===1) { location.href='/'+mine[0].path+'/'+roleUrl(mine[0].role)+hash; return; }
  showModal('<div class="eyebrow">Choose a project</div><h3>Which project?</h3><div class="s">Tools save their results to the project so everyone on it can see them.</div>'+
    mine.map(function(p){ return '<a class="btn" style="width:100%;justify-content:flex-start;margin-bottom:8px" href="/'+esc(p.path)+'/'+roleUrl(p.role)+hash+'">'+esc(p.name)+'</a>'; }).join(''));
}
function setType(t, thenCreate){
  fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'set-type', accountType:t})})
    .then(function(r){return r.json();}).then(function(j){ if (j.ok) { U = j.user; D.user = j.user; render(); if (thenCreate) openCreate(); } });
}

/* ── create project ── */
var C = null;
function showModal(html){ $('m').oninput = null; $('m').innerHTML = '<button class="x" onclick="closeModal()" aria-label="Close">×</button>'+html; $('m-bg').style.display='flex'; document.body.style.overflow='hidden'; }
function closeModal(){ var wasFlow = C && !C.created && $('c-next-btn'); if (wasFlow) { grab(); draftSave(); } $('m-bg').style.display='none'; document.body.style.overflow=''; if (wasFlow) render(); }
// Windows never close from a tap outside them or a stray key — only the × does, so nobody loses a half-finished
// sign-up or project by accident.
function mTyped(){ return [].some.call(document.querySelectorAll('#m input:not([readonly]):not([type=checkbox]):not([type=range]):not([type=hidden]), #m textarea'), function(i){ return String(i.value).trim() !== ''; }); }
var DRAFT_KEY = 'cg_project_draft_' + (U.identifier || '');
function draftSave(){ try { if (C && !C.created) localStorage.setItem(DRAFT_KEY, JSON.stringify(C)); } catch(e){} }
function draftClear(){ try { localStorage.removeItem(DRAFT_KEY); } catch(e){} }
function draftLoad(){ try { var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); return d && !d.created && (d.address || d.classification || d.scope || d.mode==='underway') ? d : null; } catch(e){ return null; } }
function draftDiscard(){ C = null; draftClear(); render(); }
function openCreate(tool){
  if (C && !C.created && (C.address || C.classification || C.scope || C.mode==='underway')) { if (tool) C.tool = tool; return drawCreate(); }   // resume where they left off
  C = {step: isGC() ? 0 : 1, mode:'new', address:'', name:'', classification:'', subtype:'', scope:'', phase:'Pre-construction', percent:0, startDate:'', nextMilestone:'', clientName:'', clientEmail:'', tool:tool||''};
  drawCreate();
}
function steps(){ return isGC() ? (C.mode==='underway' ? [0,1,2,3,4] : [0,1,2,3,5]) : [1,2,3]; }
function dots(){ var s=steps(); return '<div class="dots">'+s.map(function(n){ return '<i class="'+(s.indexOf(n)<=s.indexOf(C.step)?'on':'')+'"></i>'; }).join('')+'</div>'; }
var SUBS = {residential:[['single-family','Single-family'],['multi-family','Multi-family'],['adu','ADU'],['condo-townhome','Condo / townhome']],
            commercial:[['office','Office'],['retail','Retail'],['restaurant','Restaurant'],['mixed-use','Mixed-use'],['industrial','Industrial'],['other','Other']]};
var PHASES = ['Pre-construction','Design + plans','Permitting','Demolition','Site work + grading','Foundation','Framing','Rough-ins (MEP)','Inspections','Insulation + drywall','Finishes','Punch list','Closeout'];
function drawCreate(msg){
  draftSave();
  var s = C.step, h = dots() + '<div class="stepno">Step '+(steps().indexOf(C.step)+1)+' of '+steps().length+'</div>';
  if (s===0) {
    h += '<h3>New project or already underway?</h3><div class="s">Either way you can use every tool right away.</div>'+
      '<div class="cards2" style="margin:0 0 18px"><button class="opt'+(C.mode==='new'?' on':'')+'" id="mode-new" onclick="C.mode=\'new\';drawCreate()"><b>New project</b><span>Pre-construction: code check, plan analysis, 3D scan</span></button>'+
      '<button class="opt'+(C.mode==='underway'?' on':'')+'" id="mode-underway" onclick="C.mode=\'underway\';drawCreate()"><b>Already underway</b><span>Set the current phase and bring your client in</span></button></div>';
  } else if (s===1) {
    h += '<h3>'+(isGC()?'Where’s the job?':'Where’s the property?')+'</h3><div class="s">The address becomes your project’s page, like buildcommonground.io/123mainst.</div>'+
      '<label for="c-addr">Property address</label><input id="c-addr" autocomplete="street-address" placeholder="123 Main St, Los Angeles, CA 90049" value="'+esc(C.address)+'">'+
      '<label for="c-name">Project name (optional)</label><input id="c-name" placeholder="e.g. Kitchen remodel" value="'+esc(C.name)+'">';
  } else if (s===2) {
    h += '<h3>What kind of property?</h3><div class="s">This sets which codes we check against.</div>'+
      '<div class="cards2" style="margin:0 0 16px"><button class="opt'+(C.classification==='residential'?' on':'')+'" id="cls-res" onclick="C.classification=\'residential\';C.subtype=\'\';drawCreate()"><b>Residential</b><span>Homes, ADUs, multi-family. Checked against the residential code (CRC / IRC) + energy code.</span></button>'+
      '<button class="opt'+(C.classification==='commercial'?' on':'')+'" id="cls-com" onclick="C.classification=\'commercial\';C.subtype=\'\';drawCreate()"><b>Commercial</b><span>Office, retail, restaurant, mixed-use. Checked against the building code (CBC / IBC), accessibility + fire.</span></button></div>'+
      (C.classification ? '<label>Type</label><div class="chips">'+SUBS[C.classification].map(function(x){ return '<button class="'+(C.subtype===x[0]?'on':'')+'" data-sub="'+x[0]+'" onclick="C.subtype=\''+x[0]+'\';drawCreate()">'+x[1]+'</button>'; }).join('')+'</div>' : '');
  } else if (s===3) {
    h += '<h3>What’s the work?</h3><div class="s">Pick the closest match.</div><div class="chips">'+
      Object.keys(SCOPE).map(function(k){ return '<button class="'+(C.scope===k?'on':'')+'" data-scope="'+k+'" onclick="C.scope=\''+k+'\';drawCreate()">'+SCOPE[k]+'</button>'; }).join('')+'</div>';
  } else if (s===4) {
    h += '<h3>Where does it stand today?</h3><div class="s">Your client sees this on their project page. Update it any time.</div>'+
      '<label for="c-phase">Current phase</label><select id="c-phase">'+PHASES.map(function(p){ return '<option'+(C.phase===p?' selected':'')+'>'+p+'</option>'; }).join('')+'</select>'+
      '<label for="c-pct">Percent complete · <b id="c-pct-v" style="color:var(--white)">'+C.percent+'%</b></label><input id="c-pct" type="range" min="0" max="100" step="5" value="'+C.percent+'" oninput="C.percent=+this.value;$(\'c-pct-v\').textContent=this.value+\'%\'">'+
      '<div class="row2"><div><label for="c-start">Start date</label><input id="c-start" type="date" value="'+esc(C.startDate)+'"></div><div><label for="c-next">Next milestone</label><input id="c-next" placeholder="e.g. Framing inspection" value="'+esc(C.nextMilestone)+'"></div></div>'+
      clientFields();
  } else if (s===5) {
    h += '<h3>Bring your client in?</h3><div class="s">Optional. They get a link to follow progress and approve decisions.</div>'+clientFields();
  }
  var last = steps()[steps().length-1] === s;
  h += '<div class="msg" id="c-msg"'+(msg?' style="display:block"':'')+'>'+esc(msg||'')+'</div>'+
    '<div class="acts">'+(steps()[0]!==s?'<button class="btn back" id="c-back-btn" onclick="stepBack()">Back</button>':'')+
    '<button class="btn pri" id="c-next-btn" onclick="stepNext()">'+(last?'Create project':'Continue')+'</button></div>';
  showModal(h);
  $('m').oninput = function(){ grab(); draftSave(); };   // every keystroke is kept
}
function clientFields(){
  return '<div class="row2"><div><label for="c-cname">Client name</label><input id="c-cname" value="'+esc(C.clientName)+'"></div><div><label for="c-cemail">Client email</label><input id="c-cemail" type="email" value="'+esc(C.clientEmail)+'"></div></div>'+
    '<div class="note">Leave blank to invite them later from the project’s Team tab.</div>';
}
function grab(){
  if ($('c-addr')) { C.address=$('c-addr').value.trim(); C.name=$('c-name').value.trim(); }
  if ($('c-phase')) { C.phase=$('c-phase').value; C.startDate=$('c-start').value; C.nextMilestone=$('c-next').value.trim(); }
  if ($('c-cname')) { C.clientName=$('c-cname').value.trim(); C.clientEmail=$('c-cemail').value.trim(); }
}
function stepBack(){ grab(); var s=steps(); C.step = s[Math.max(0, s.indexOf(C.step)-1)]; drawCreate(); }
function stepNext(){
  grab(); var s=steps(), i=s.indexOf(C.step);
  if (C.step===1 && C.address.length<5) return drawCreate('Enter the property address.');
  if (C.step===2 && !C.classification) return drawCreate('Choose residential or commercial.');
  if (C.step===3 && !C.scope) return drawCreate('Pick the type of work.');
  if ((C.step===4||C.step===5) && (C.clientName && !C.clientEmail || !C.clientName && C.clientEmail)) return drawCreate('Add both the client’s name and email, or leave both blank.');
  if (i < s.length-1) { C.step = s[i+1]; return drawCreate(); }
  var b=$('c-next-btn'); b.disabled=true; b.textContent='Creating…';
  var body = {action:'create', address:C.address, name:C.name, classification:C.classification, subtype:C.subtype, scope:C.scope, as: isGC()?'gc':'client', mode:C.mode,
    phase:C.phase, percent:C.percent, startDate:C.startDate, nextMilestone:C.nextMilestone, clientName:C.clientName, clientEmail:C.clientEmail};
  fetch('/api/project',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)})
    .then(function(r){ return r.json(); }).catch(function(){ return {error:'network'}; }).then(function(j){
      if (!j.ok) return drawCreate({address_required:'Enter the property address.', classification_required:'Choose residential or commercial.', too_many_attempts:'You’ve created a lot of projects today. Try again tomorrow.', network:'Could not reach the server.'}[j.error] || 'That didn’t work. Try again.');
      C.created = true; draftClear();
      var dest = j.url + (C.tool ? (C.tool==='schedule'?'#schedule':'#tool-'+C.tool) : isGC() ? (C.mode==='underway'?'':'#tools') : '#proposals');
      if (j.clientInvite) {
        showModal('<div class="eyebrow">Project created</div><h3>'+esc(j.project.name)+' is ready</h3><div class="s">'+(j.clientInvite.emailed?'We emailed '+esc(j.clientInvite.name)+' an invite. You can also text them this link:':'Send '+esc(j.clientInvite.name)+' this link to join:')+'</div>'+
          '<input id="c-invite" readonly value="'+esc(j.clientInvite.link)+'" onclick="this.select()">'+
          '<div class="acts"><button class="btn" onclick="copyInvite()">Copy link</button><a class="btn pri" id="open-project" href="'+esc(dest)+'">Open project</a></div>');
        return;
      }
      location.href = dest;
    });
}
function copyInvite(){ var i=$('c-invite'); i.select(); try { navigator.clipboard.writeText(i.value); } catch(e) { document.execCommand('copy'); } }

render();
if (/#start/.test(location.hash) && U.accountType) openCreate();
</script>
</body>
</html>
